name: Comitê ABM (Apollo → trocas de emprego e lideranças novas)

on:
  schedule:
    # Exportar o comitê do Odoo para o Apollo: toda segunda, 08h05 BRT (11:05 UTC)
    - cron: "5 11 * * 1"
    # Trocas de emprego: toda segunda, 08h20 BRT (11:20 UTC)
    - cron: "20 11 * * 1"
    # Lideranças novas: dia 1 de cada mês, 08h30 BRT (11:30 UTC)
    - cron: "30 11 1 * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "trocas (saídas), lideres (lideranças novas) ou exportar (comitê → Apollo)"
        required: true
        default: "trocas"
        type: choice
        options: [trocas, lideres, exportar]
      dry_run:
        description: "true = só mostra o que faria, sem gravar no Odoo nem no Apollo"
        required: false
        default: "true"
      dias_no_cargo:
        description: "Lideranças: máximo de dias no cargo atual"
        required: false
        default: "45"

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    environment: automações

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Sincronizar comitê
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          APOLLO_DIAS_NO_CARGO: ${{ github.event.inputs.dias_no_cargo || '45' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # No agendamento: 11:05 de segunda = exportar, 11:20 de segunda = trocas, dia 1 = lideres.
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '30 11 1 * *' && 'lideres' || (github.event.schedule == '5 11 * * 1' && 'exportar' || 'trocas')) }}
        run: python sincronizar_apollo_comite_abm.py --modo "$MODO"
