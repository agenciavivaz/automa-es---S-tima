name: Diagnostico Etapas BrandSpot (somente leitura)

on:
  # Gatilho `push` removido (2026-09-08) para não disparar em commits.
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    environment: automações
    # ⛔ DESATIVADO (2026-09-08): diagnóstico Pipedrive → Odoo descontinuado.
    # Enquanto esta guarda for `false`, o job é pulado e nenhum script roda —
    # nem por "Run workflow". NÃO reative sem pedido explícito no chat.
    # Código mantido apenas como referência histórica.
    if: ${{ false }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Diagnosticar etapas (somente leitura)
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          PIPEDRIVE_TOKEN: ${{ secrets.PIPEDRIVE_TOKEN }}
          PIPEDRIVE_PIPELINE_ID: "9"
        run: python descobrir_etapas_brandspot.py
